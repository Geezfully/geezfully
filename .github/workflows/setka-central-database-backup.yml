name: SETKA encrypted central database backup

on:
  schedule:
    # Moldova alternates between UTC+2 and UTC+3, so 20:00 UTC is the 23:00 local
    # target. GitHub delays scheduled runs by anything from minutes to hours, so
    # four attempts are queued; the backup script keeps one backup per Moldova
    # date and exits cleanly on the attempts that find the day already covered.
    - cron: "0 20,21,22,23 * * *"
  workflow_dispatch:
    inputs:
      source_check_only:
        description: Validate SETKA source access without creating a backup
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: central-database-backup-setka
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --batch --yes --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Install pinned Supabase upload client
        if: ${{ !inputs.source_check_only }}
        run: npm install --no-save --ignore-scripts @supabase/supabase-js@2.57.4

      - name: Create, encrypt, and upload SETKA backup
        if: ${{ !inputs.source_check_only }}
        env:
          SOURCE_DB_URL: ${{ secrets.SETKA_BACKUP_DB_URL }}
          BACKUP_SUPABASE_URL: ${{ secrets.CENTRAL_BACKUP_SUPABASE_URL }}
          BACKUP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CENTRAL_BACKUP_PUBLISHABLE_KEY }}
          BACKUP_GATEWAY_SECRET: ${{ secrets.SETKA_BACKUP_GATEWAY_SECRET }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.SETKA_BACKUP_ENCRYPTION_KEY }}
        run: bash scripts/create-setka-central-backup.sh

      - name: Validate SETKA source backup access
        if: ${{ inputs.source_check_only }}
        env:
          SOURCE_DB_URL: ${{ secrets.SETKA_BACKUP_DB_URL }}
        run: |
          psql "$SOURCE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --command="select count(*) >= 0 from public.studios; select count(*) >= 0 from public.monthly_entries; select count(*) >= 0 from auth.users;"
          pg_dump --dbname="$SOURCE_DB_URL" --schema-only --no-owner --no-acl --file=/tmp/setka-schema.sql
          test -s /tmp/setka-schema.sql
