<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="app-build" content="2026-10-06-bskt-1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSKT Registru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<link rel="stylesheet" href="app.css?v=20261008-18">
</head>
<body>

<!-- ══ AUTH ══ -->
<div id="auth-screen">
  <div class="auth-brand">
    <div class="auth-logo">BSKT <span style="color:var(--text)">PONTAJ</span></div>
    <div class="auth-rule"></div>
    <div class="auth-sub" data-i18n="au_sub">Registru electronic · BSKT Cup 3×3</div>
  </div>
  <div class="auth-mode-switch">
    <div class="lang-switch">
      <button class="lang-btn" id="auth-mode-admin" data-i18n="au_modeAdmin" onclick="setAuthMode('admin')">Administrator</button>
      <button class="lang-btn" id="auth-mode-locatie" data-i18n="au_modeLocatie" onclick="setAuthMode('locatie')">Locație</button>
    </div>
  </div>
  <div class="auth-box">
    <div class="auth-fields" id="auth-form-admin">
      <div class="field">
        <label class="auth-label" data-i18n="au_email">E-mail</label>
        <input type="email" id="l-email" class="auth-input" data-i18n-ph="au_emailPh" placeholder="nume@exemplu.com" autocomplete="username" onkeydown="if(event.key==='Enter')login()">
      </div>
      <div>
        <label class="auth-label" data-i18n="au_pass">Parolă</label>
        <input type="password" id="l-password" class="auth-input" data-i18n-ph="au_passPh" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
      </div>
      <button class="auth-submit" id="login-btn" data-i18n="au_login" onclick="login()">Autentificare</button>
      <div class="auth-hint" id="login-msg"></div>
    </div>
    <div class="auth-fields" id="auth-form-locatie" style="display:none">
      <div>
        <label class="auth-label" data-i18n="au_pin">Cod PIN</label>
        <input type="password" inputmode="numeric" id="l-pin" class="auth-pin-input" data-i18n-ph="au_pinPh" placeholder="••••••" autocomplete="off" onkeydown="if(event.key==='Enter')loginLocatie()">
      </div>
      <button class="auth-submit" id="login-locatie-btn" data-i18n="au_login" onclick="loginLocatie()">Autentificare</button>
      <div class="auth-hint" id="login-locatie-msg"></div>
    </div>
  </div>
  <div class="auth-lang">
    <div class="lang-switch">
      <button class="lang-btn" data-lang="ro" onclick="setLang('ro')">RO</button>
      <button class="lang-btn" data-lang="ru" onclick="setLang('ru')">RU</button>
    </div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app-shell">
  <div class="sb-scrim" id="sb-scrim" onclick="toggleSidebar(false)"></div>
  <aside id="sidebar">
    <div class="sb-brand">
      <img src="favicon.svg" alt="BSKT">
      <div>
        <div class="sb-brand-text">BSKT PONTAJ</div>
        <div class="sb-brand-sub" data-i18n="sb_sub">Registru · BSKT Cup</div>
      </div>
    </div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-foot">
      <span data-i18n="sb_shift">Schimb curent</span><br><strong id="sb-admin" style="color:var(--text)">—</strong>
    </div>
  </aside>

  <div id="content-scroll">
    <header>
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn-ghost" id="burger-btn" onclick="toggleSidebar()" aria-label="Deschide meniul"></button>
        <div class="header-title" id="header-title">Tablou de bord</div>
      </div>
      <div class="header-right">
        <div class="lang-switch">
          <button class="lang-btn" data-lang="ro" onclick="setLang('ro')">RO</button>
          <button class="lang-btn" data-lang="ru" onclick="setLang('ru')">RU</button>
        </div>
        <span class="header-user" id="header-user">Rusu Andrei</span>
        <button class="btn-ghost" data-i18n="hdr_logout" onclick="logout()">Ieșire</button>
      </div>
    </header>
    <main id="main"></main>
  </div>
</div>

<!-- ══ PARTICIPANT PROFILE MODAL ══ -->
<div class="modal-overlay" id="profile-modal">
  <div class="modal-box profile-modal-box">
    <div class="modal-head">
      <div class="modal-title" id="profile-modal-title" data-i18n="pa_fisa">Fișa jucătorului</div>
      <div class="modal-head-actions">
        <button class="btn-primary btn-sm" id="profile-edit-btn" data-i18n="pa_editBtn" onclick="renderProfile(true)">Editează datele</button>
        <button class="btn-ghost btn-sm" id="profile-pdf-btn" data-i18n="fi_btnPdf" onclick="exportFisaPdf()">Fișa PDF</button>
        <button class="btn-danger btn-sm" id="profile-delete-btn" data-i18n="pa_deleteBtn" onclick="deleteParticipant()">Șterge jucător</button>
        <button class="modal-close" onclick="closeModal('profile-modal')">✕</button>
      </div>
    </div>
    <div class="modal-body" id="profile-modal-body"></div>
  </div>
</div>

<!-- ══ TEAM EDITOR MODAL ══ -->
<div class="modal-overlay" id="record-modal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title" id="record-modal-title"></div>
      <div class="modal-head-actions"><button class="modal-close" onclick="closeModal('record-modal')">✕</button></div>
    </div>
    <div class="modal-body" id="record-modal-body"></div>
  </div>
</div>

<div class="modal-overlay" id="team-modal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title" id="team-modal-title">Echipă</div>
      <div class="modal-head-actions"><button class="modal-close" onclick="closeModal('team-modal')">✕</button></div>
    </div>
    <div class="modal-body" id="team-modal-body"></div>
  </div>
</div>

<!-- ══ ARBITRU PROFILE MODAL ══ -->
<div class="modal-overlay" id="arbitru-modal">
  <div class="modal-box profile-modal-box">
    <div class="modal-head">
      <div class="modal-title" id="arbitru-modal-title" data-i18n="arb_fisa">Fișă arbitru</div>
      <div class="modal-head-actions">
        <button class="btn-primary btn-sm" id="arbitru-edit-btn" data-i18n="arb_editBtn" onclick="renderArbitruProfile(true)">Editează datele</button>
        <button class="btn-danger btn-sm" id="arbitru-delete-btn" data-i18n="arb_deleteBtn" onclick="deleteArbitru()">Șterge arbitru</button>
        <button class="modal-close" onclick="closeModal('arbitru-modal')">✕</button>
      </div>
    </div>
    <div class="modal-body" id="arbitru-modal-body"></div>
  </div>
</div>

<!-- ══ RAPORT DE SCHIMB MODAL ══ -->
<div class="modal-overlay" id="act-modal">
  <div class="modal-box act-modal-box">
    <div class="modal-head">
      <div class="modal-title" data-i18n="act_docTitle">Raport de schimb</div>
      <div class="modal-head-actions">
        <select id="act-export-lang" class="act-lang-select" onchange="setActExportLanguage(this.value)" aria-label="Limba raportului">
          <option value="ro">RO</option><option value="ru">RU</option>
        </select>
        <button class="btn-ghost btn-sm" onclick="exportActExcel(currentActPreview, actExportLanguage)" data-i18n="re_excel">Excel</button>
        <button class="btn-ghost btn-sm" onclick="exportActPdf(currentActPreview, actExportLanguage)" data-i18n="re_pdf">PDF</button>
        <button class="btn-ghost btn-sm" onclick="printActReport()" data-i18n="re_print">Imprimare</button>
        <button class="modal-close" onclick="closeModal('act-modal')">✕</button>
      </div>
    </div>
    <div class="modal-body" id="act-modal-body"></div>
  </div>
</div>

<!-- ══ HELPER REVIEW (stacks over the editors) ══ -->
<div class="modal-overlay" id="review-modal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title" id="review-modal-title"></div>
      <div class="modal-head-actions"><button class="modal-close" onclick="closeReview()">✕</button></div>
    </div>
    <div class="modal-body" id="review-modal-body"></div>
  </div>
</div>

<aside class="refresh-reminder" id="location-refresh-reminder" role="status" aria-live="polite">
  <div class="refresh-reminder-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 8a8 8 0 0 1 13.2-2L20 7M4 17l.7 1A8 8 0 0 0 18 16"/></svg></div>
  <div class="refresh-reminder-content">
    <div class="refresh-reminder-title" id="refresh-reminder-title"></div>
    <div class="refresh-reminder-text" id="refresh-reminder-text"></div>
    <div class="refresh-reminder-actions">
      <button class="refresh-reminder-refresh" id="refresh-reminder-refresh" onclick="forceFreshReload()"></button>
      <button class="refresh-reminder-close" id="refresh-reminder-close" onclick="hideRefreshReminder()"></button>
    </div>
  </div>
</aside>

<script src="app.js?v=20261008-18"></script>
</body>
</html>
