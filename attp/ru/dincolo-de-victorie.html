  </div>
  <div class="hint" id="hint"></div>
  <button class="read-pill" id="readPill" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="7" rx="1"/><rect x="6" y="14" width="12" height="7" rx="1"/></svg><span>Постранично</span></button>
  <div class="toast" id="toast" hidden><span id="toastText"></span><button id="toastGo" type="button">Продолжить</button><button class="x" id="toastX" type="button" aria-label="Закрыть" title="Закрыть">×</button></div>
</main>

<footer class="fbar">
  <button class="tbtn" id="btnPrev" type="button" aria-label="Предыдущая страница" title="Предыдущая страница"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>

  <button class="tbtn" id="btnNext" type="button" aria-label="Следующая страница" title="Следующая страница"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
</footer>

<aside class="drawer" id="drawer" aria-labelledby="drawerTitle">
  <div class="drawer__head"><h2 id="drawerTitle">Содержание</h2><button id="drawerClose" type="button" aria-label="Закрыть" title="Закрыть">×</button></div>

</aside>
